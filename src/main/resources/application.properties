
spring.application.name=adoptaPet

# Conexion a MySQL en Aiven
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Hibernate y JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Configuración de Firebase Storage
firebase.bucket.name=adoptapet-631c8.firebasestorage.app
firebase.storage.path=adoptapet
firebase.json.path=firebase
firebase.json.file=adoptapet-631c8-firebase-adminsdk-fbsvc-59e522c0dc.json