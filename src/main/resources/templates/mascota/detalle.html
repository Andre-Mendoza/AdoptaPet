
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/head :: head}"></head>

    <body>

        <header th:replace="~{general/header :: header}"></header>

        <main class="contenido-principal">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="fw-bold">Detalles de la mascota</h1>

                <a th:href="@{/catalogo/listado}"
                   class="btn btn-outline-secondary">
                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Volver al catálogo
                </a>
            </div>

            <section class="tarjeta p-4">

                <div class="row g-4 align-items-start">

                    <div class="col-md-5 text-center">

                        <img th:if="${mascota.fotografia != null
                             and !#strings.isEmpty(mascota.fotografia)}"
                             th:src="${mascota.fotografia}"
                             th:alt="${mascota.nombre}"
                             class="img-fluid rounded-4"
                             style="width: 100%; max-height: 450px; object-fit: cover;">

                        <div th:unless="${mascota.fotografia != null
                             and !#strings.isEmpty(mascota.fotografia)}"
                             class="d-flex justify-content-center align-items-center rounded-4"
                             style="height: 350px; background-color: #E4EDE3;">
                            <i class="fa-solid fa-paw fa-5x"
                               style="color: #244C38;"></i>
                        </div>

                    </div>

                    <div class="col-md-7">

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h2 class="fw-bold" th:text="${mascota.nombre}">
                                Nombre
                            </h2>

                            <span class="badge rounded-pill"
                                  style="background-color: #E4EDE3; color: #244C38;"
                                  th:text="${mascota.estado}">
                                Disponible
                            </span>

                        </div>

                        <p class="text-muted">
                            Conoce más sobre esta mascota que busca un hogar.
                        </p>

                        <hr>

                        <h5 class="fw-bold mb-3">Información de la mascota</h5>

                        <p><strong>Especie:</strong>
                            <span th:text="${mascota.especie}"></span>
                        </p>

                        <p><strong>Raza:</strong>
                            <span th:text="${mascota.raza}"></span>
                        </p>

                        <p><strong>Edad:</strong>
                            <span th:text="${mascota.edad}"></span> años
                        </p>

                        <p><strong>Sexo:</strong>
                            <span th:text="${mascota.sexo}"></span>
                        </p>

                        <p><strong>Tamaño:</strong>
                            <span th:text="${mascota.tamano}"></span>
                        </p>

                        <p><strong>Color:</strong>
                            <span th:text="${mascota.color}"></span>
                        </p>

                        <p><strong>Peso:</strong>
                            <span th:text="${mascota.peso}"></span> kg
                        </p>

                        <hr>

                        <h5 class="fw-bold mb-3">Sobre esta mascota</h5>

                        <p th:text="${mascota.descripcion}">
                            Descripción de la mascota.
                        </p>

                        <hr>

                        <h5 class="fw-bold mb-3">Refugio</h5>

                        <p>
                            <i class="fa-solid fa-house me-2"
                               style="color: #244C38;"></i>
                            <span th:text="${mascota.refugio.nombre}"></span>
                        </p>

                        <!-- <a th:href="@{/catalogo/listado}"
                            class="btn btn-principal mt-3">
                             <i class="fa-solid fa-paw me-2"></i>
                             Volver al catálogo
                         </a> -->
                        
                      
                        <!-- Botón para iniciar una solicitud de adopción -->
                        <a th:href="@{/solicitud/nuevo(idMascota=${mascota.idMascota})}"
                           class="btn btn-principal mt-3 me-2">

                            <i class="fa-solid fa-heart me-2"></i>
                            Solicitar adopción

                        </a>

                        <a th:href="@{/catalogo/listado}"
                           class="btn btn-outline-secondary mt-3">

                            <i class="fa-solid fa-arrow-left me-2"></i>
                            Volver al catálogo

                        </a>

                    </div>

                </div>

            </section>

        </main>

        <footer th:replace="~{general/footer :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
