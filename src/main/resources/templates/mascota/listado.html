
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/head :: head}"></head>
<body>
    <header th:replace="~{general/header :: header}"></header>

    <main class="contenido-principal">
        <h2>Gestión de Mascotas</h2>

        <a th:href="@{/mascota/nuevo}" class="btn btn-primary mb-3">
            Nueva Mascota
        </a>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Especie</th>
                        <th>Raza</th>
                        <th>Edad</th>
                        <th>Sexo</th>
                        <th>Tamaño</th>
                        <th>Estado</th>
                        <th>Refugio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="mascota : ${mascotas}">
                        <td th:text="${mascota.idMascota}"></td>
                        <td th:text="${mascota.nombre}"></td>
                        <td th:text="${mascota.especie}"></td>
                        <td th:text="${mascota.raza}"></td>
                        <td th:text="${mascota.edad}"></td>
                        <td th:text="${mascota.sexo}"></td>
                        <td th:text="${mascota.tamano}"></td>
                        <td th:text="${mascota.estado}"></td>
                        <td th:text="${mascota.refugio.nombre}"></td>
                        <td>
                            <a th:href="@{/mascota/modificar/{id}(id=${mascota.idMascota})}"
                               class="btn btn-warning btn-sm">Modificar</a>

                            <a th:href="@{/mascota/eliminar/{id}(id=${mascota.idMascota})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar esta mascota?')">
                                Eliminar
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(mascotas)}">
                        <td colspan="10" class="text-center">
                            No hay mascotas registradas.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer th:replace="~{general/footer :: footer}"></footer>
</body>
</html>
