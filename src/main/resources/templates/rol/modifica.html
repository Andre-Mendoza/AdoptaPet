
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/head :: head}">
    <title>AdoptaPet - Formulario de Rol</title>
</head>

<body>

    <header th:replace="~{general/header :: header}"></header>

    <main class="contenido-principal container-fluid py-4">

        <div class="row justify-content-center">
            <div class="col-12 col-lg-9 col-xl-8">

                <div class="card shadow-sm border-0">

                    <div class="card-header bg-primary text-white py-3">
                        <h2 class="mb-0">Formulario de Rol</h2>
                    </div>

                    <main class="contenido-principal">

                        <p class="text-muted mb-4">
                            Complete la información correspondiente al rol.
                        </p>

                        <form th:action="@{/rol/guardar}"
                              method="POST"
                              th:object="${rol}">

                            <input type="hidden" th:field="*{idRol}"/>

                            <div class="mb-4">
                                <label for="nombre" class="form-label fw-bold">
                                    Nombre del rol
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="nombre"
                                       th:field="*{nombre}"
                                       placeholder="Ingrese el nombre del rol"
                                       required
                                       maxlength="50"/>
                            </div>

                            <div class="mb-4">
                                <label for="descripcion" class="form-label fw-bold">
                                    Descripción
                                </label>

                                <textarea class="form-control"
                                          id="descripcion"
                                          th:field="*{descripcion}"
                                          placeholder="Describa las funciones de este rol"
                                          maxlength="150"
                                          rows="4"></textarea>

                                <div class="form-text">
                                    Máximo 150 caracteres.
                                </div>
                            </div>

                            <hr class="my-4"/>

                            <div class="d-flex justify-content-end gap-2">

                                <a th:href="@{/rol/listado}"
                                   class="btn btn-secondary">
                                    Cancelar
                                </a>

                                <button type="submit"
                                        class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>
                                    Guardar cambios
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer th:replace="~{general/footer :: footer}"></footer>

</body>
</html>
