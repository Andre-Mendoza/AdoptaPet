<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/head :: head}">
    <title>AdoptaPet - Roles</title>
</head>

<body>

    <header th:replace="~{general/header :: header}"></header>

    <main class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Roles</h2>

            <a th:href="@{/rol/nuevo}" class="btn btn-primary">
                Nuevo Rol
            </a>
        </div>

        <div class="table-responsive">

            <table class="table table-striped table-bordered">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="rol : ${roles}">
                        <td th:text="${rol.idRol}"></td>
                        <td th:text="${rol.nombre}"></td>
                        <td th:text="${rol.descripcion}"></td>

                        <td>
                            <a th:href="@{/rol/modificar/{idRol}(idRol=${rol.idRol})}"
                               class="btn btn-warning btn-sm">
                                Editar
                            </a>

                            <a th:href="@{/rol/eliminar/{idRol}(idRol=${rol.idRol})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar este rol?');">
                                Eliminar
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(roles)}">
                        <td colspan="4" class="text-center">
                            No hay roles registrados.
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </main>

    <footer th:replace="~{general/footer :: footer}"></footer>

</body>
</html>
