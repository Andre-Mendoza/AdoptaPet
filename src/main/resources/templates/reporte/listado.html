

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/head :: head}">
    <title th:text="#{reporte.titulo}">AdoptaPet - Reportes</title>
</head>

<head>
    <style>
        @media print {
            header,
            footer,
            button {
                display: none !important;
            }

            main {
                margin: 0 !important;
                padding: 10px !important;
                width: 100% !important;
            }

            body {
                background: white !important;
            }
        }
    </style>
</head>

<body>

    <header th:replace="~{general/header :: header}"></header>

    <main class="container mt-4">

        <div class="d-flex justify-content-end mb-3">
            <button type="button"
                    class="btn btn-primary"
                    onclick="window.print()"
                    th:text="#{reporte.imprimir}">
                Imprimir reporte
            </button>
        </div>

        <h2 class="mb-4" th:text="#{reporte.titulo}">
            Reportes del sistema
        </h2>

        <div class="row mb-4">

            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5 th:text="#{reporte.totalAdopciones}">
                            Total de adopciones
                        </h5>
                        <h2 th:text="${totalAdopciones}">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5 th:text="#{reporte.totalSolicitudes}">
                            Total de solicitudes
                        </h5>
                        <h2 th:text="${totalSolicitudes}">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5 th:text="#{reporte.totalMascotas}">
                            Total de mascotas
                        </h5>
                        <h2 th:text="${totalMascotas}">0</h2>
                    </div>
                </div>
            </div>

        </div>

        <h4 class="mb-3" th:text="#{reporte.detalleAdopciones}">
            Detalle de adopciones
        </h4>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">

                <thead class="table-dark">
                    <tr>
                        <th th:text="#{adopcion.id}">ID</th>
                        <th th:text="#{adopcion.fecha}">Fecha</th>
                        <th th:text="#{adopcion.mascota}">Mascota</th>
                        <th th:text="#{adopcion.usuario}">Adoptante</th>
                        <th th:text="#{adopcion.estado}">Estado</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="adopcion : ${adopciones}">
                        <td th:text="${adopcion.idAdopcion}"></td>
                        <td th:text="${adopcion.fechaAdopcion}"></td>
                        <td th:text="${adopcion.mascota.nombre}"></td>
                        <td th:text="${adopcion.usuario.nombre}"></td>
                        <td th:text="${adopcion.estadoAdopcion}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(adopciones)}">
                        <td colspan="5" class="text-center"
                            th:text="#{reporte.sinAdopciones}">
                            No hay adopciones registradas.
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>

    </main>

    <footer th:replace="~{general/footer :: footer}"></footer>

</body>
</html>
