
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/head :: head}"></head>

<body>

    <header th:replace="~{general/header :: header}"></header>

    <main class="contenido-principal">

        <div class="mb-4">
            <h1 class="fw-bold">Encuentra a tu mejor amigo</h1>
            <p class="text-secondary">
                Conoce nuestras mascotas disponibles para adopción.
            </p>
        </div>

        <div class="row g-4">

            <div class="col-md-6 col-lg-4"
                 th:each="mascota : ${mascotasDisponibles}">

                <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">

                    <img th:if="${mascota.fotografia != null
                                  and !#strings.isEmpty(mascota.fotografia)}"
                         th:src="${mascota.fotografia}"
                         th:alt="${mascota.nombre}"
                         class="card-img-top"
                         style="height: 230px; object-fit: cover;">

                    <div th:unless="${mascota.fotografia != null
                                      and !#strings.isEmpty(mascota.fotografia)}"
                         class="d-flex align-items-center justify-content-center bg-light"
                         style="height: 230px;">
                        <i class="fa-solid fa-paw fa-4x"
                           style="color: #244C38;"></i>
                    </div>

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title fw-bold mb-0"
                                th:text="${mascota.nombre}">
                            </h5>

                            <span class="badge rounded-pill"
                                  style="background-color: #E4EDE3; color: #244C38;"
                                  th:text="${mascota.estado}">
                            </span>
                        </div>

                        <p class="card-text text-secondary mb-1">
                            <i class="fa-solid fa-paw me-2"></i>
                            <span th:text="${mascota.especie}"></span>
                        </p>

                        <p class="card-text text-secondary mb-1">
                            <i class="fa-solid fa-dog me-2"></i>
                            <span th:text="${mascota.raza}"></span>
                        </p>

                        <p class="card-text text-secondary mb-3">
                            <i class="fa-solid fa-calendar me-2"></i>
                            <span th:text="${mascota.edad}"></span> años
                        </p>

                        <a th:href="@{/mascota/detalle/{id}(id=${mascota.idMascota})}"
                           class="btn btn-principal w-100">
                            Ver detalles
                        </a>

                    </div>
                </div>
            </div>

        </div>

        <div th:if="${#lists.isEmpty(mascotasDisponibles)}"
             class="tarjeta text-center py-5">

            <i class="fa-solid fa-paw fa-3x mb-3"
               style="color: #244C38;"></i>

            <h4>No hay mascotas disponibles</h4>

            <p class="text-secondary mb-0">
                Pronto tendremos nuevos amigos buscando un hogar.
            </p>

        </div>

    </main>

    <footer th:replace="~{general/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
