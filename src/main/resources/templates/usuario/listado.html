<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/head :: head}">
    <title>AdoptaPet - Usuarios</title>
</head>

<body>

    <header th:replace="~{general/header :: header}"></header>

    <main class="contenido-principal">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Usuarios</h2>

            <a th:href="@{/usuario/nuevo}" class="btn btn-primary">
                Nuevo Usuario
            </a>
        </div>

        <div class="table-responsive">

            <table class="table table-striped table-bordered">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo electrónico</th>
                        <th>Teléfono</th>
                        <th>Dirección</th>
                        <th>Estado</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.idUsuario}"></td>
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.correoElectronico}"></td>
                        <td th:text="${usuario.telefono}"></td>
                        <td th:text="${usuario.direccion}"></td>
                        <td th:text="${usuario.estado}"></td>
                        <td th:text="${usuario.rol.nombre}"></td>

                        <td>
                            <a th:href="@{/usuario/modificar/{idUsuario}(idUsuario=${usuario.idUsuario})}"
                               class="btn btn-warning btn-sm">
                                Editar
                            </a>

                            <a th:href="@{/usuario/eliminar/{idUsuario}(idUsuario=${usuario.idUsuario})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar este usuario?');">
                                Eliminar
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="8" class="text-center">
                            No hay usuarios registrados.
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </main>

    <footer th:replace="~{general/footer :: footer}"></footer>

</body>
</html>
