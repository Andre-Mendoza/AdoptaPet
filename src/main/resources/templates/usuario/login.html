
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/head :: head}"></head>

    <body>

        <header th:replace="~{general/header :: header}"></header>

        <main class="contenido-principal">

            <div class="row justify-content-center">

                <div class="col-md-7 col-lg-5">

                    <section class="tarjeta p-4 p-md-5">

                        <div class="text-center mb-4">

                            <i class="fa-solid fa-paw fa-3x mb-3"
                               style="color: #244C38;"></i>

                            <h1 class="fw-bold">Bienvenido de nuevo</h1>

                            <p class="text-muted">
                                Inicia sesión para continuar con AdoptaPet.
                            </p>

                        </div>

                        <form th:action="@{/usuario/login}"
                              method="POST">
                            
                     <!-- 1 esto es una prueba-->
                          <div th:if="${error}"
                                 class="alert alert-danger text-center"
                                 role="alert"
                                 th:text="${error}">
                            </div>
                     <!-- 1 esto es una prueba-->

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Correo electrónico
                                </label>

                                <input type="email"
                                       name="correoElectronico"
                                       class="form-control"
                                       placeholder="ejemplo@correo.com"
                                       required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Contraseña
                                </label>

                                <input type="password"
                                       name="contrasena"
                                       class="form-control"
                                       placeholder="Ingresa tu contraseña"
                                       required>

                            </div>

                            <button type="submit"
                                    class="btn btn-principal w-100 mt-3">

                                <i class="fa-solid fa-right-to-bracket me-2"></i>
                                Iniciar sesión

                            </button>

                        </form>

                        <hr class="my-4">

                        <p class="text-center mb-0">
                            ¿Todavía no tienes una cuenta?

                            <a th:href="@{/usuario/registro}"
                               style="color: #244C38; font-weight: bold;">
                                Regístrate aquí
                            </a>
                        </p>

                    </section>

                </div>

            </div>

        </main>

        <footer th:replace="~{general/footer :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
