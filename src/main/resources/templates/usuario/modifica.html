<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/head :: head}"></head>

<body>

    <header th:replace="~{general/header :: header}"></header>

    <main class="container mt-5 mb-5">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Modificar usuario</h3>
                    </div>

                    <div class="card-body">

                        <!-- Mensaje de error -->
                        <div th:if="${error}"
                             class="alert alert-danger"
                             role="alert"
                             th:text="${error}">
                        </div>

                        <form th:action="@{/usuario/guardar}"
                              th:object="${usuario}"
                              method="POST">

                            <input type="hidden"
                                   th:field="*{idUsuario}"/>

                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{nombre}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email"
                                       class="form-control"
                                       th:field="*{correoElectronico}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password"
                                       class="form-control"
                                       th:field="*{contrasena}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{telefono}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Dirección</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{direccion}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Estado</label>
                                <select class="form-select"
                                        th:field="*{estado}"
                                        required>
                                    <option value="Activo">Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Rol</label>
                                <select class="form-select"
                                        th:field="*{rol.idRol}"
                                        required>
                                    <option value="">Seleccione un rol</option>
                                    <option th:each="rol : ${roles}"
                                            th:value="${rol.idRol}"
                                            th:text="${rol.nombre}">
                                    </option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between mt-4">

                                <a th:href="@{/usuario/listado}"
                                   class="btn btn-secondary">
                                    Cancelar
                                </a>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Guardar cambios
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer th:replace="~{general/footer :: footer}"></footer>

</body>
</html>
