
<!DOCTYPE html>
<!-- Desarrollado por: Isabel -->
<!-- Función: Mostrar el formulario de solicitud de adopción -->

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/head :: head}"></head>

    <body>

        <header th:replace="~{general/header :: header}"></header>

        <main class="contenido-principal">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h1 class="fw-bold">
                    [[#{solicitud.titulo}]]
                </h1>

                <a th:href="@{/catalogo/listado}"
                   class="btn btn-outline-secondary">

                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Volver al catálogo

                </a>

            </div>

            <!-- Incluir fragmento del formulario -->
            <section th:replace="~{solicitud/fragmentos :: formulario}"></section>

        </main>

        <footer th:replace="~{general/footer :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/solicitud.js}"></script>

    </body>
</html>
